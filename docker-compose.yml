services:
  app:
    build: .
    container_name: network-monitor
    ports:
      - "${FLASK_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      FLASK_DEBUG: "false"
      AUTO_START_CAPTURE: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
